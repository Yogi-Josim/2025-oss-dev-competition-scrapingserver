name: Deploy

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Github Repository 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/yogi-josim-fastapi-scraper:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: "레포지토리 체크아웃"
        uses: actions/checkout@v4
      
      - name: "docker-compose-scraper.yml SCP 전송"
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: "./docker-compose-scraper.yml"
          target: "~/docker/"
          
      # 서버에 접속하여 컨테이너 재시작
      - name: "애플리케이션 서버 구동"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            cd ~/docker/
            docker pull ${{ secrets.DOCKER_USERNAME }}/yogi-josim-fastapi-scraper:latest
            docker-compose -f docker-compose-scraper.yml up -d
            docker image prune -af

  check:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: "애플리케이션 서버 정상 동작 여부 점검"
        uses: jtalk/url-health-check-action@v4
        with:
          url: http://${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_API_PORT }}
          max-attempts: 5
          retry-delay: 10s