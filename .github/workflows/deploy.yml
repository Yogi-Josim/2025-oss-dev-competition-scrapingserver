# scraper-api-repo/.github/workflows/docker-build-push.yml

name: Build and Push Scraper API to Docker Hub

# 1. 트리거 설정: main 브랜치에 push 이벤트가 발생할 때 실행
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHub Actions 탭에서 수동으로 실행 가능

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 실행 환경 지정

    steps:
      # 2. 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Docker Hub 로그인 (GitHub Secrets 사용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Docker Buildx 설정 (최신 빌드 기능 사용)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Docker 이미지 빌드 및 Docker Hub에 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true # true로 설정해야 푸시됨
          tags: | # 이미지 태그 설정
            ${{ secrets.DOCKER_USERNAME }}/yogi-josim-fastapi-scraper:latest
            ${{ secrets.DOCKER_USERNAME }}/yogi-josim-fastapi-scraper:${{ github.sha }}